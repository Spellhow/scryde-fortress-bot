name: Preview Community Sources (manual)

on:
  workflow_dispatch:
    inputs:
      source_alias:
        description: 'Optional source alias from community.json; blank previews first five'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  preview:
    if: github.repository != 'Spellhow/scryde-fortress-bot' && vars.COMMUNITY_MODE == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-community.txt
      - name: Install lightweight public feed parser
        run: python -m pip install -r requirements-community.txt
      - name: Preview authorized public sources only
        env:
          COMMUNITY_CONFIG_FILE: community.json
          PREVIEW_SOURCE_ID: ${{ inputs.source_alias }}
        run: python scripts/preview_sources.py
