name: Siege Bot

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  # Opt-in GitHub-only scheduling; skipped unless GITHUB_ONLY_MODE=true.
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
  # VPS systemd timer dispatches this workflow every 10 minutes, staggered from News Bot.
  # Opt-in GitHub cron may run late; use VPS dispatch for time-sensitive production alerts.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scryde-state
  cancel-in-progress: false

jobs:
  run-bot:
    if: (github.event_name != 'schedule' || vars.GITHUB_ONLY_MODE == 'true') && vars.COMMUNITY_MODE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Keep BSOE state isolated from template/fork installations.
      STATE_FILE: ${{ github.repository == 'Spellhow/scryde-fortress-bot' && 'site_state.json' || 'community_state.json' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest repository state
        shell: bash
        run: |
          git fetch origin master
          git rebase origin/master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-actions.txt

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements-actions.txt') }}

      - name: Install Python dependencies
        run: pip install -r requirements-actions.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Ensure state file exists
        run: |
          if [ ! -f "$STATE_FILE" ]; then
            echo '{}' > "$STATE_FILE"
          fi

      - name: Run siege regression tests
        env:
          TG_TOKEN: test
          TG_CHAT: test
          TG_CHAT_DEBUG: test
        run: python -m unittest -v test_fortress_loss_signal.py test_dispatch_watchdog.py

      - name: Run siege check
        id: siege_check
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_CHAT_DEBUG: ${{ secrets.TG_CHAT_DEBUG }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_TARGET_CHAT: prod
          NEWS_AUTO_PUBLISH_GRACE_MIN: 30
          RUN_NEWS: false
          RUN_NEWS_QUEUE: true
          RUN_SIEGES: true
          OUR_CLAN: ${{ vars.OUR_CLAN || 'BSOE' }}
          FORTRESS_URL: ${{ vars.FORTRESS_URL || 'https://ua.scryde.game/rankings/1000/fortresses' }}
          CASTLE_URL: ${{ vars.CASTLE_URL || 'https://ua.scryde.game/rankings/1000/castles' }}
          SCRYDE_CHANNEL_URL: ${{ vars.SCRYDE_CHANNEL_URL || 'https://t.me/s/scryde' }}
          SCRYDE_FORUM_UPDATES_URL: https://board.scryde.net/threads/obnovlenija.30694/page-19?from=game-news
          BACKOFF_MINUTES_ON_CHALLENGE: 0
          CASTLE_ANTIBOT_RETRIES: 1
          DEBUG_SCRYDE_FETCH: false
          SIEGE_DIAG_DIR: siege_diagnostics
        run: python github_runner.py

      - name: Upload siege diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siege-diagnostics
          path: siege_diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated state
        id: persist_state
        shell: bash
        run: ./ops/persist_state_with_retry.sh "$STATE_FILE"

      - name: Notify Telegram about workflow failure
        if: ${{ failure() }}
        shell: bash
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_DEBUG: ${{ secrets.TG_CHAT_DEBUG }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHECK_OUTCOME: ${{ steps.siege_check.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist_state.outcome }}
        run: |
          if [[ -z "$TG_TOKEN" || -z "$TG_CHAT_DEBUG" ]]; then
            echo "Telegram failure notification is not configured"
            exit 0
          fi
          if [[ "$CHECK_OUTCOME" == "failure" ]]; then
            reason="monitoring check failed"
          elif [[ "$PERSIST_OUTCOME" == "failure" ]]; then
            reason="state persistence failed after retries"
          else
            reason="workflow infrastructure failed"
          fi
          text="🚨 Scryde Siege Bot: $reason — $RUN_URL"
          curl -fsS --retry 2 --retry-delay 2 \
            --data-urlencode "chat_id=$TG_CHAT_DEBUG" \
            --data-urlencode "text=$text" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" >/dev/null || true
