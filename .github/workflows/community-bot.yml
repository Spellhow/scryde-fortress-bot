name: Community Bot (GitHub-only)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '3,23,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scryde-state
  cancel-in-progress: false

jobs:
  publish:
    if: vars.COMMUNITY_MODE == 'true' && (github.event_name != 'schedule' || vars.RUN_GITHUB_SCHEDULE == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMMUNITY_CONFIG_FILE: community.json
      COMMUNITY_STATE_FILE: community_deliveries.json
      COMMUNITY_DRY_RUN: ${{ vars.COMMUNITY_DRY_RUN || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-community.txt
      - name: Install lightweight dependencies (no browser)
        run: python -m pip install -r requirements-community.txt
      - name: Validate configuration
        run: python community_runner.py --validate
      - name: Check destination secrets without sending
        id: credentials_check
        if: ${{ vars.COMMUNITY_DRY_RUN != 'true' }}
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMUNITY_SECRETS_JSON: ${{ secrets.COMMUNITY_SECRETS_JSON }}
        run: python community_runner.py --check-credentials
      - name: Poll public sources and deliver
        id: community_run
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMUNITY_SECRETS_JSON: ${{ secrets.COMMUNITY_SECRETS_JSON }}
          COMMUNITY_DISCORD_EMBEDS: ${{ vars.COMMUNITY_DISCORD_EMBEDS || 'false' }}
        run: python community_runner.py
      - name: Persist delivery state
        if: ${{ always() && vars.COMMUNITY_DRY_RUN != 'true' }}
        run: bash ./ops/persist_community_state.sh
      - name: Report any degraded polling or delivery
        if: ${{ steps.community_run.outcome == 'failure' || steps.credentials_check.outcome == 'failure' }}
        run: exit 1
