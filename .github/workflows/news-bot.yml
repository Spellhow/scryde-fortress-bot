name: News Bot

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Keep the 10-minute cadence but avoid GitHub's top-of-hour scheduler hotspot.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      news_test_post_ids:
        description: 'Optional comma-separated Telegram post ids for Gemini news test, e.g. 4457,4456'
        required: false
        default: ''
      forum_test_post_ids:
        description: 'Optional comma-separated forum post ids for Gemini forum test, e.g. 2617420'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: scryde-state
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest repository state
        shell: bash
        run: |
          git fetch origin master
          git rebase origin/master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-actions.txt

      - name: Install Python dependencies
        run: pip install -r requirements-actions.txt

      - name: Ensure state file exists
        run: |
          if [ ! -f site_state.json ]; then
            echo '{}' > site_state.json
          fi

      - name: Run pending queue regression tests
        env:
          TG_TOKEN: test
          TG_CHAT: test
        run: python -m unittest -v test_pending_news_queue.py

      - name: Run news check
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_CHAT_DEBUG: ${{ secrets.TG_CHAT_DEBUG }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Exact stable model IDs that Google currently lists as Free Tier ($0 input/output).
          GEMINI_MODEL: gemini-3.5-flash-lite
          SCRYDE_WIKI_GEMINI_FALLBACK_MODEL: gemini-3.1-flash-lite
          NEWS_TARGET_CHAT: prod
          NEWS_TEST_POST_IDS: ${{ github.event.inputs.news_test_post_ids }}
          FORUM_TEST_POST_IDS: ${{ github.event.inputs.forum_test_post_ids }}
          NEWS_APPROVE_DELAY_MIN: 25
          NEWS_PENDING_EXPIRE_HOURS: 24
          NEWS_AUTO_PUBLISH_GRACE_MIN: 30
          NEWS_MAX_NEW_POSTS_PER_RUN: 5
          RUN_NEWS: true
          RUN_SIEGES: false
          OUR_CLAN: BSOE
          FORTRESS_URL: https://ua.scryde.game/rankings/1000/fortresses
          CASTLE_URL: https://ua.scryde.game/rankings/1000/castles
          SCRYDE_CHANNEL_URL: https://t.me/s/scryde
          SCRYDE_WIKI_UPDATES_URL: https://ru.scryde.game/wiki/articles/patch-notes/updates
          SCRYDE_FORUM_UPDATES_URL: https://board.scryde.net/threads/obnovlenija.30694/latest
          STATE_FILE: site_state.json
          BACKOFF_MINUTES_ON_CHALLENGE: 60
        run: |
          python wiki_patch_notes.py
          python github_runner.py

      - name: Commit updated state
        shell: bash
        run: |
          if git diff --quiet -- site_state.json; then
            echo "No state changes"
            exit 0
          fi
          git add site_state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update fortress bot state"
          git pull --rebase origin master
          git push
